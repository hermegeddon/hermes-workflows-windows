[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-workflows-py"
version = "1.0.2"
description = "Windows-native Python DAG workflow backend for Hermes Agent"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hermes-workflows-py = "hermes_workflows.cli:main"
hermes-workflows = "hermes_workflows.cli:main"

[tool.setuptools]
packages = ["hermes_workflows"]
